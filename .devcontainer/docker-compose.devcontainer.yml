services:
  dev:
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename:-nuclaud}:cached
    env_file: .env
    network_mode: service:sql
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    entrypoint: ["/bin/bash", "-c", "export MSSQL_SA_PASSWORD=$$NUCLAUD_SA_SENHA && /opt/mssql/bin/sqlservr"]
    volumes:
      - sqldados:/var/opt/mssql
volumes:
  sqldados:
