services:
  - type: web
    name: nuclaud-demo
    runtime: python
    plan: free
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: NUCLAUD_DB
        value: /tmp/nuclaud-demo.db
      - key: NUCLAUD_SETUP_TOKEN
        generateValue: true
